# Relatório semanal: domingo à noite, com macro, carteira, reserva e a pergunta da semana.
# Envia por Telegram (TELEGRAM_TOKEN + TELEGRAM_CHAT_ID) ou ntfy (NTFY_TOPIC) — ver README.
name: Relatório semanal

on:
  schedule:
    - cron: '0 21 * * 0' # domingo às 18h em Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semanal

jobs:
  relatorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A carteira, o diário e o estudo vivem num repositório privado. Sem o token DADOS_TOKEN
      # (ou se ele ainda não existir), o relatório sai igual, só sem as partes pessoais.
      - name: Trazer os dados privados, quando o token existir
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: JVHubert/painel-macro-dados
          token: ${{ secrets.DADOS_TOKEN }}
          path: privado

      - name: Apontar as ferramentas para a pasta privada
        run: |
          if [ -f privado/carteira.json ]; then
            echo "DADOS_DIR=privado/" >> "$GITHUB_ENV"
            echo "os dados vieram do repositório privado"
          else
            echo "sem os dados privados nesta execução: sigo com o secret CARTEIRA_JSON"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar as dependências
        run: npm ci

      - name: Atualizar os indicadores
        run: node tools/coletar.mjs

      - name: Conferir as contas
        run: npm test

      - name: Usar a carteira do secret
        env:
          CARTEIRA_JSON: ${{ secrets.CARTEIRA_JSON }}
        run: |
          if [ -z "$CARTEIRA_JSON" ]; then
            echo "::error::crie o secret CARTEIRA_JSON com o conteúdo do seu carteira.json (ele é pessoal e não vai para o repositório)"
            exit 1
          fi
          printf '%s\n' "$CARTEIRA_JSON" > carteira.json
          echo "carteira.json veio do secret (não vai para o commit)"

      - name: Montar e enviar o relatório
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node tools/relatorio.mjs
