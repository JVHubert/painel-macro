# Todo dia busca os indicadores no Banco Central e publica o JSON novo.
# Roda duas vezes ao dia porque a coleta da Selic/CDI sai no meio da manhã e o dólar fecha às 18h.
name: Atualizar indicadores

on:
  schedule:
    - cron: '10 12 * * *' # 09:10 em Brasília
    - cron: '10 21 * * *' # 18:10 em Brasília
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  coletar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Buscar os indicadores
        run: node tools/coletar.mjs

      - name: Conferir as contas
        run: npm test

      - name: Publicar o novo JSON
        run: |
          set -euo pipefail
          git add dados/indicadores.json
          if git diff --cached --quiet; then
            echo "sem mudança nos indicadores"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "dados: indicadores de $(date -u +%d/%m/%Y)"
          # A main pode ter andado enquanto os indicadores eram coletados.
          git pull --rebase --autostash origin main
          git push

      - name: Montar o site
        run: node tools/publicar.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      # O commit do robô não dispara o workflow do site, então publicamos aqui também.
      - id: publicacao
        uses: actions/deploy-pages@v4
