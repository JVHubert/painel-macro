# Todo dia busca os indicadores no Banco Central e publica o JSON novo.
# Roda duas vezes ao dia porque a coleta da Selic/CDI sai no meio da manhã e o dólar fecha às 18h.
name: Atualizar indicadores

on:
  schedule:
    - cron: '10 12 * * *' # 09:10 em Brasília
    - cron: '10 21 * * *' # 18:10 em Brasília
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  coletar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Os dados pessoais vivem num repositório privado; o token cuida do acesso.
      # Se o token faltar, o job segue com o que estiver versionado.
      - name: Buscar os dados privados
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: JVHubert/painel-macro-dados
          token: ${{ secrets.DADOS_TOKEN }}
          path: privado

      - name: Usar os dados privados (quando existem)
        run: |
          if [ -f privado/carteira.json ]; then
            echo "DADOS_DIR=privado/" >> "$GITHUB_ENV"
            echo "os dados vieram do repositório privado"
          else
            echo "sem dados privados: sigo com o que estiver no repositório"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Buscar os indicadores
        run: node tools/coletar.mjs

      # O que você respondeu no Telegram entra no estudo e no diário por aqui.
      # Sem os dados privados não há onde anotar, então a mensagem fica esperando a próxima rodada.
      - name: Ler o que chegou no Telegram
        if: hashFiles('privado/carteira.json') != ''
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node tools/telegram.mjs

      - name: Conferir as contas
        run: npm test

      - name: Publicar o novo JSON
        run: |
          set -euo pipefail
          git add dados/indicadores.json
          if git diff --cached --quiet; then
            echo "sem mudança nos indicadores"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "dados: indicadores de $(date -u +%d/%m/%Y)"
          # A main pode ter andado enquanto os indicadores eram coletados.
          git pull --rebase --autostash origin main
          git push

      # O que foi anotado por aqui mora no repositório privado, então salvamos lá também.
      - name: Guardar no repositório privado
        if: hashFiles('privado/carteira.json') != ''
        run: |
          set -euo pipefail
          cd privado
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nada novo no repositório privado"
            exit 0
          fi
          git commit -m "dados: anotado pelo Telegram"
          git pull --rebase
          git push

      - name: Montar o site
        run: node tools/publicar.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      # O commit do robô não dispara o workflow do site, então publicamos aqui também.
      - id: publicacao
        uses: actions/deploy-pages@v4
